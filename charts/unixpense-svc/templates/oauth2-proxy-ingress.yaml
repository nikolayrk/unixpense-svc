{{- if .Values.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "unixpense-svc.fullname" . }}-oauth2-proxy-ingress
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2000m"
    nginx.ingress.kubernetes.io/proxy-buffer-size: "8k"
    nginx.ingress.kubernetes.io/proxy-buffers-number: '4'
  labels:
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ (.Values.config).unixpenseHostPrefix | default "" }}/oauth2
            pathType: Prefix
            backend:
              service:
                name: {{ include "unixpense-svc.fullname" . }}-oauth2-proxy
                port:
{{- $oauth2Proxy := index .Values "oauth2-proxy" }}
                  number: {{ $oauth2Proxy.config.port | default 80 }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
{{- end }}