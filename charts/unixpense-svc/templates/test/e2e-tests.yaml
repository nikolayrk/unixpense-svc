apiVersion: v1
kind: Pod
metadata:
  name: {{ include "unixpense-svc.fullname" . }}-e2e-tests
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
  labels:
    app: {{ include "unixpense-svc.fullname" . }}
spec:
  containers:
  - name: tests
    image: debian:bullseye-slim
    workingDir: /usr/src
    command: 
      - /bin/bash
      - ./sh/run_e2e_tests.sh
    env:
      - name: SERVICE_URI_INTERNAL
        value: "{{ include "unixpense-svc.fullname" $ }}:{{ .Values.service.port }}"
      - name: NODE_ENV
        value: {{ (.Values.config).nodeEnv | default "" | quote }}
      - name: UNIXPENSE_HOST
        value: {{ .Values.ingress.host | quote }}
      - name: MARIADB_HOST
        value: "{{ .Release.Name }}-mariadb"
      - name: MARIADB_PORT
        value: "{{ .Values.mariadb.primary.service.ports.mysql | default 3306 }}"
      - name: MARIADB_USER
        value: {{ .Values.mariadb.auth.username | quote }}
      - name: MARIADB_PASSWORD
        value: {{ .Values.mariadb.auth.password | quote }}
      - name: MARIADB_DATABASE
        value: {{ .Values.mariadb.auth.database | quote }}
      - name: REDIS_HOST
        value: "{{ include "unixpense-svc.fullname" . }}-redis-master"
    volumeMounts:
      - name: app-source
        mountPath: /usr/src
  volumes:
  - name: app-source
    hostPath:
      path: /usr/src # From ./kind-config.yaml
      type: Directory
  hostAliases:
    - ip: "{{ regexReplaceAll "-.*" (index .Values.metallb.ipAddressPool.addresses 0) "" }}"
      hostnames:
      - "{{ .Values.ingress.host }}"
  restartPolicy: Never