{{- if .Values.test.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "unixpense-svc.fullname" . }}-mock-oauth2-server
  namespace: {{ .Release.Namespace }}
  labels:
    app: mock-oauth2-server
  annotations:
spec:
  containers:
  - name: mock-oauth2-server
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
    - name: http
      containerPort: 8080
    readinessProbe:
      tcpSocket:
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5
  restartPolicy: Never
{{- end }}