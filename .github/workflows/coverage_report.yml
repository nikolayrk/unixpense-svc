name: 'coverage-report'

on: 
  push:
    branches:
      - develop
    paths:
      - 'src/**'

permissions:
  contents: write

jobs:
  run-coverage-tests:
    name: Run coverage tests
    uses: ./.github/workflows/run_tests_reusable.yml
    with:
      NODE_ENV: test_coverage
      up-flags: "--build --abort-on-container-exit"
      services: coverage_tests
      artifacts-path: coverage/

  generate-badge-and-publish:
    name: Generate coverage badge
    needs: run-coverage-tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v5
    - name: Download coverage report
      uses: actions/download-artifact@v6
      with:
        name: coverage
        path: coverage/
    - name: Generate badge
      uses: jaywcjlove/coverage-badges-cli@main
      with:
        source: coverage/coverage-summary.json
        output: coverage/badge.svg
    - name: Publish coverage report and badge to GitHub Pages
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: coverage
        target-folder: coverage