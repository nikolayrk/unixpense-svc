name: CI-CD

on: 
  push:
    branches:
      - develop
    paths-ignore:
      - '**/README.md'
      # - '.github/**'

jobs:
  discord-notify-start:
    name: Discord Notify Start
    runs-on: ubuntu-latest
    outputs:
      image_description: ${{ steps.setenv.outputs.DOCKER_IMAGE_DESCRIPTION }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
    - id: setenv
      shell: bash
      run: |
        JOINED_COMMITS="$(echo "${{ join(github.event.commits.*.message, '\n\n') }}")"

        MAX_LEN=1900 # Discord limit is 2000 per field
        JOINED_COMMITS_TRUNCATED="$JOINED_COMMITS"

        if [ $(echo "$JOINED_COMMITS" | wc -c) -gt $MAX_LEN ]; then
          JOINED_COMMITS_TRUNCATED="$(echo "$JOINED_COMMITS" | head -c $MAX_LEN)... (truncated)"
        fi

        {
          echo "COMMIT_MESSAGES<<EOF"
          echo "$JOINED_COMMITS_TRUNCATED"
          echo EOF
        } >> "$GITHUB_ENV"

        COMMIT_MESSAGE_SUMMARY=$(git log -1 --pretty=%B | head -n 1)
        echo "DOCKER_IMAGE_DESCRIPTION=${{ github.sha }} - ${COMMIT_MESSAGE_SUMMARY}" >> "$GITHUB_OUTPUT"
    - name: Discord Notify
      uses: sarisia/actions-status-discord@v1
      env:
        COMMIT_MESSAGES: ${{ env.COMMIT_MESSAGES }}
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        nodetail: true
        title: "♻️ Started ${{ github.repository }} - ${{ github.workflow }} #${{ github.run_number }}"
        description: ${{ env.COMMIT_MESSAGES }}

  shellcheck:
    name: Shellcheck
    needs: discord-notify-start
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './sh'
          severity: error

  build:
    name: Build
    needs: discord-notify-start
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
    - name: Authenticate with PAT
      run: echo "${{ secrets.GH_TOKEN }}" | gh auth login --with-token
    - uses: actions/checkout@v7
    - name: Docker Setup Buildx
      uses: docker/setup-buildx-action@v4.2.0
      with:
        platforms: linux/arm64/v8
    - name: Login to Docker Hub
      uses: docker/login-action@v4.5.2
      with:
        registry: ${{ vars.DOCKER_REGISTRY_URL }}
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_PASSWORD }}
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ vars.DOCKER_REPO }}
        labels: |
          org.opencontainers.image.description=${{ needs.discord-notify-start.outputs.image_description }}
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Dockerfile
        platforms: linux/arm64/v8
        push: true
        labels: ${{ steps.meta.outputs.labels }}
        tags: |
          ${{ vars.DOCKER_REGISTRY_URL }}/${{ vars.DOCKER_REPO }}:latest
          ${{ vars.DOCKER_REGISTRY_URL }}/${{ vars.DOCKER_REPO }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        outputs: |
          type=image,name=target,annotation-index.org.opencontainers.image.description=${{ needs.discord-notify-start.outputs.image_description }}

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Kubernetes Set Context
        uses: Azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBECONFIG }}
      - name: Create Namespace
        run: >
          kubectl create namespace unixpense
          -o yaml --dry-run=client | kubectl apply -f -
      - name: Create Configuration ConfigMap
        run: >
          kubectl create configmap unixpense-svc-config
          --namespace=unixpense
          --from-literal=PORT=${{ vars.PORT }}
          --from-literal=NODE_ENV=${{ vars.NODE_ENV }}
          --from-literal=LOG_LEVEL=${{ vars.LOG_LEVEL }}
          --from-literal=UNIXPENSE_HOST=${{ vars.UNIXPENSE_HOST }}
          --from-literal=UNIXPENSE_HOST_PREFIX=${{ vars.UNIXPENSE_HOST_PREFIX }}
          --from-literal=LOKI_HOST=${{ vars.LOKI_HOST }}
          --from-literal=VERSION=${{ github.sha }}
          -o yaml --dry-run=client | kubectl apply -f -
      - name: Create OAuth2 Configuration ConfigMap
        run: >
          kubectl create configmap oauth2-authenticated-emails
          --namespace unixpense
          --from-literal=authenticated-emails=${{ vars.GMAIL_ADDRESS }}
          -o yaml --dry-run=client | kubectl apply -f -
      - name: Create Refresh Script ConfigMap
        run: >
          kubectl create configmap refresh-sh
          --namespace unixpense
          --from-file=sh/refresh.sh
          -o yaml --dry-run=client | kubectl apply -f -
      - name: Create Docker Config Secret
        env:
          DOCKER_REGISTRY_CREDENTIALS: '${{ secrets.DOCKERHUB_USERNAME }}:${{ secrets.DOCKERHUB_PASSWORD }}'
          DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
        run: |
          DOCKER_REGISTRY_CREDENTIALS=$(echo -n ${DOCKER_REGISTRY_CREDENTIALS} | base64)

          DOCKERCONFIGJSON=$(cat <<EOF
          {
              "auths": {
                  "${DOCKER_REGISTRY_URL}": {
                          "auth": "${DOCKER_REGISTRY_CREDENTIALS}"
                  }
              }
          }
          EOF
          )
          
          kubectl create secret generic dockerconfig \
          --namespace unixpense \
          --type=kubernetes.io/dockerconfigjson \
          --from-literal=.dockerconfigjson="$DOCKERCONFIGJSON" \
          -o yaml --dry-run=client | kubectl apply -f -
        shell: sh
      - name: Create MariaDb Secret
        uses: Azure/k8s-create-secret@v6
        with:
          namespace: 'unixpense'
          secret-type: 'generic'
          secret-name: mariadb-secret
          string-data: |
            {
              "MARIADB_HOST": "${{ secrets.MARIADB_HOST }}",
              "MARIADB_PORT": "${{ secrets.MARIADB_PORT }}",
              "MARIADB_USER": "${{ secrets.MARIADB_USER }}",
              "MARIADB_PASSWORD": "${{ secrets.MARIADB_PASSWORD }}",
              "MARIADB_DATABASE": "${{ vars.MARIADB_DATABASE }}",
              "MARIADB_RANDOM_ROOT_PASSWORD": "yes"
            }
      - name: Create Google OAuth2 Credentials Secret
        uses: Azure/k8s-create-secret@v6
        with:
          namespace: 'unixpense'
          secret-type: 'generic'
          secret-name: google-cred
          string-data: |
            {
              "GOOGLE_OAUTH2_CLIENT_ID": "${{ secrets.GOOGLE_OAUTH2_CLIENT_ID }}",
              "GOOGLE_OAUTH2_CLIENT_SECRET": "${{ secrets.GOOGLE_OAUTH2_CLIENT_SECRET }}"
            }
      - name: Create OAuth2 Cookie Secret
        uses: Azure/k8s-create-secret@v6
        with:
          namespace: 'unixpense'
          secret-type: 'generic'
          secret-name: oauth2-cookie-secret
          string-data: |
            {
              "cookie-secret": "${{ secrets.OAUTH2_PROXY_COOKIE_SECRET }}"
            }
      - name: Create Discord Secret
        uses: Azure/k8s-create-secret@v6
        with:
          namespace: 'unixpense'
          secret-type: 'generic'
          secret-name: discord-secret
          string-data: |
            {
              "DISCORD_WEBHOOK": "${{ secrets.DISCORD_WEBHOOK }}"
            }
      - name: Deploy to Kubernetes Cluster
        uses: swdotcom/update-and-apply-kubernetes-configs@v1
        with:
          k8-config-file-paths: |
            cicd/manifests/redis-config.yaml
            cicd/manifests/auth-deployment.yaml
            cicd/manifests/auth-network.yaml
            cicd/manifests/mariadb-deployment.yaml
            cicd/manifests/mariadb-service.yaml
            cicd/manifests/deployment.yaml
            cicd/manifests/service.yaml
            cicd/manifests/ingress.yaml
            cicd/manifests/cronjob.yaml
          replacement-method: defined
        env:
          DOCKER_REGISTRY_URL: ${{ vars.DOCKER_REGISTRY_URL }}
          DOCKER_REPO: ${{ vars.DOCKER_REPO }}
          latest: ${{ github.sha }}
          PORT: ${{ vars.PORT }}
          REDIS_NFS_SERVER: ${{ vars.REDIS_NFS_SERVER }}
          REDIS_NFS_PATH: ${{ vars.REDIS_NFS_PATH }}
          UNIXPENSE_HOST: ${{ vars.UNIXPENSE_HOST }}
          UNIXPENSE_HOST_PREFIX: ${{ vars.UNIXPENSE_HOST_PREFIX }}
          MARIADB_NFS_SERVER: ${{ vars.MARIADB_NFS_SERVER }}
          MARIADB_NFS_PATH: ${{ vars.MARIADB_NFS_PATH }}
          CRONTAB: ${{ vars.CRONTAB }}

  discord-notify-end:
    name: Discord Notify End
    if: always()
    needs: [ discord-notify-start, shellcheck, build, deploy ]
    runs-on: ubuntu-latest
    steps:
    - run: |
        if [ "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]; then
          exit 0
        fi

        if [ "${{ contains(needs.*.result, 'failure') }}" == "true" ]; then
          echo STATUS_TITLE="❌ ${{ github.repository }} ${{ github.workflow }} #${{ github.run_number }} was unsuccessful" >> $GITHUB_ENV
          echo STATUS_COLOR="0xFF0000" >> $GITHUB_ENV

          exit 0
        fi

        echo STATUS_TITLE="✅ ${{ github.repository }} ${{ github.workflow }} #${{ github.run_number }} was successful" >> $GITHUB_ENV
        echo STATUS_COLOR="0x00FF00" >> $GITHUB_ENV
    - name: Discord Notify
      uses: sarisia/actions-status-discord@v1
      if: env.STATUS_TITLE != ''
      with:
        webhook: ${{ secrets.DISCORD_WEBHOOK }}
        nodetail: true
        title: ${{ env.STATUS_TITLE }}
        color: ${{ env.STATUS_COLOR }}