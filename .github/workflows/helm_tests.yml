name: 'hemn-tests'

on:
  workflow_call:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0
        with:
          version: v3.14.4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Create kind cluster
        uses: helm/kind-action@v1.10.0

      - name: Create namespace
        run: kubectl create namespace unixpense

      - name: Run chart-testing (install)
        run: |
          ct install --target-branch ${{ github.event.repository.default_branch }} \
            --skip-clean-up \
            --namespace unixpense \
            --helm-extra-set-args "\
              --set=dockerRegistry.url=${{ vars.DOCKER_REGISTRY_URL }} \
              --set=dockerRegistry.username=${{ secrets.DOCKERHUB_USERNAME }} \
              --set=dockerRegistry.password=${{ secrets.GITHUB_TOKEN }} \
              --set=image.repository=${{ vars.DOCKER_REPO }} \
              --set=image.tag=${{ github.sha }}"

      - name: Report integration tests job status
        run: bash ./sh/report_integration_tests_job_status.sh
