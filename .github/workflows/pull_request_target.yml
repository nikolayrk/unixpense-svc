name: Pull Request Target Workflow

on:
  pull_request_target:
    
concurrency:
  group: "pull_request_target-${{ github.event.pull_request.number }}"
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  test-app:
    uses: ./.github/workflows/test-node-app.yml
    with:
      ref: ${{ github.head_ref }}

  purge-old-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check if image tag exists
        id: check_tag
        run: |
          TAG="pr-${{ github.event.pull_request.number }}"
          echo "Checking for tag: $TAG"
          IMAGES=$(gh api "/users/${{ github.repository_owner }}/packages/container/${{ github.event.repository.name }}/versions" --jq ".[].metadata.container.tags[]" | grep "$TAG" || true)
          echo "Images found: $IMAGES"
          if [ -n "$IMAGES" ]; then
            echo "tag_exists=true" >> $GITHUB_OUTPUT
          else
            echo "tag_exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Purge old image
        if: steps.check_tag.outputs.tag_exists == 'true'
        uses: chipkent/action-cleanup-package@v1.0.3
        with:
          package-name: ${{ github.event.repository.name }}
          tag: pr-${{ github.event.pull_request.number }}
          github-token: ${{ secrets.GH_TOKEN }}

  build-image:
    needs: test-app
    if: always()
    uses: ./.github/workflows/build-image.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      tag: pr-${{ github.event.pull_request.number }}

  test-chart:
    needs: build-image
    uses: ./.github/workflows/test-chart.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      tag: pr-${{ github.event.pull_request.number }}
